name: Build Offline APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare offline web dependencies
        shell: bash
        run: |
          set -e

          WEB="app/src/main/assets/www"
          VENDOR="$WEB/vendor"

          mkdir -p "$VENDOR"

          curl -L --fail --retry 3 \
            -o "$VENDOR/xlsx.full.min.js" \
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/html2canvas.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jszip.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/tailwind.cdn.js" \
            "https://cdn.tailwindcss.com"

          mkdir -p "$VENDOR/vazirmatn"

          npm pack vazirmatn@33.003 --silent

          PKG="$(ls vazirmatn-33.003.tgz)"
          tar -xzf "$PKG"

          CSS="$(find package -type f -name 'Vazirmatn-font-face.css' | head -n 1)"

          if [ -z "$CSS" ]; then
            echo "Vazirmatn CSS not found"
            exit 1
          fi

          cp "$CSS" "$VENDOR/vazirmatn/Vazirmatn-font-face.css"

          CSSDIR="$(dirname "$CSS")"

          cp "$CSSDIR"/*.woff2 "$VENDOR/vazirmatn/" 2>/dev/null || true
          cp "$CSSDIR"/*.woff "$VENDOR/vazirmatn/" 2>/dev/null || true
          cp "$CSSDIR"/*.ttf "$VENDOR/vazirmatn/" 2>/dev/null || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ ! -x "./gradlew" ]; then
            echo "gradlew not found"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahestanOffline-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14