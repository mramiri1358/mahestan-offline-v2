name: Build Offline APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare offline web dependencies
        shell: bash
        run: |
          set -euo pipefail

          WEB="app/src/main/assets/www"
          VENDOR="$WEB/vendor"

          mkdir -p "$VENDOR" "$VENDOR/vazirmatn"

          echo "Downloading JavaScript libraries..."

          curl -fLsS --retry 3 \
            -o "$VENDOR/xlsx.full.min.js" \
            "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"

          curl -fLsS --retry 3 \
            -o "$VENDOR/html2canvas.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"

          curl -fLsS --retry 3 \
            -o "$VENDOR/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          curl -fLsS --retry 3 \
            -o "$VENDOR/jszip.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"

          curl -fLsS --retry 3 \
            -o "$VENDOR/tailwind.cdn.js" \
            "https://cdn.tailwindcss.com"

          echo "Downloading Vazirmatn font package..."

          npm pack vazirmatn@33.0.3 --silent

          PKG="vazirmatn-33.0.3.tgz"

          test -f "$PKG" || {
            echo "Vazirmatn npm archive was not created"
            exit 1
          }

          mkdir -p package
          tar -xzf "$PKG"

          CSS="$(find package -type f -name 'Vazirmatn-font-face.css' -print -quit)"

          if [ -z "$CSS" ]; then
            echo "Vazirmatn-font-face.css not found in package"
            exit 1
          fi

          cp "$CSS" "$VENDOR/vazirmatn/Vazirmatn-font-face.css"

          find package -type f \
            \( -name '*.woff2' -o -name '*.woff' -o -name '*.ttf' \) \
            -exec cp {} "$VENDOR/vazirmatn/" \;

          echo "Rewriting web references to local files..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css":
                  "vendor/vazirmatn/Vazirmatn-font-face.css",
              "https://cdn.tailwindcss.com":
                  "vendor/tailwind.cdn.js",
              "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js":
                  "vendor/xlsx.full.min.js",
              "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js":
                  "vendor/xlsx.full.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js":
                  "vendor/html2canvas.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js":
                  "vendor/jspdf.umd.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js":
                  "vendor/jszip.min.js",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          s = re.sub(
              r'<script\b[^>]*\bsrc=["\']https://cdn\.jsdelivr\.net/npm/rrweb@[^"\']+["\'][^>]*>\s*</script\s*>',
              '',
              s,
              flags=re.I
          )

          s = re.sub(
              r'<link\b[^>]*\bid=["\']manifest-placeholder["\'][^>]*>',
              '<link rel="manifest" href="manifest.webmanifest">',
              s,
              count=1,
              flags=re.I
          )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Fixing local font paths..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/assets/www/vendor/vazirmatn/Vazirmatn-font-face.css")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'url\((\s*["\']?)([^)"\']+)(["\']?\s*)\)',
              lambda m: f'url({m.group(1)}{Path(m.group(2).strip()).name}{m.group(3)})',
              s
          )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Checking required local files..."

          test -s "$VENDOR/xlsx.full.min.js"
          test -s "$VENDOR/html2canvas.min.js"
          test -s "$VENDOR/jspdf.umd.min.js"
          test -s "$VENDOR/jszip.min.js"
          test -s "$VENDOR/tailwind.cdn.js"
          test -s "$VENDOR/vazirmatn/Vazirmatn-font-face.css"

      - name: Verify no runtime CDN dependencies
        shell: bash
        run: |
          set -euo pipefail

          if grep -nE 'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.tailwindcss\.com)' \
            app/src/main/assets/www/index.html; then
            echo "External runtime dependency remains in index.html"
            exit 1
          fi

          if grep -nE 'https?://cdn\.tailwindcss\.com' \
            app/src/main/assets/www/index.html; then
            echo "External Tailwind runtime dependency remains in index.html"
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahestanOffline-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14