name: Build Offline APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare offline web dependencies
        shell: bash
        run: |
          set -e

          WEB="app/src/main/assets/www"
          VENDOR="$WEB/vendor"

          mkdir -p "$VENDOR"

          curl -L --fail --retry 3 \
            -o "$VENDOR/xlsx.full.min.js" \
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/html2canvas.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jszip.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/tailwind.cdn.js" \
            "https://cdn.tailwindcss.com"

          mkdir -p "$VENDOR/vazirmatn"

          if [ -f "$VENDOR/NotoSansArabic-Regular.ttf" ]; then
            cp "$VENDOR/NotoSansArabic-Regular.ttf" \
              "$VENDOR/vazirmatn/NotoSansArabic-Regular.ttf"
          fi

          if [ -f "$VENDOR/NotoSansArabic-Bold.ttf" ]; then
            cp "$VENDOR/NotoSansArabic-Bold.ttf" \
              "$VENDOR/vazirmatn/NotoSansArabic-Bold.ttf"
          fi

          cat > "$VENDOR/vazirmatn/fonts.css" <<'EOF'
          @font-face {
            font-family: 'Vazirmatn';
            src: url('NotoSansArabic-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
          }

          @font-face {
            font-family: 'Vazirmatn';
            src: url('NotoSansArabic-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css":
                  "vendor/vazirmatn/fonts.css",

              "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js":
                  "vendor/xlsx.full.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js":
                  "vendor/html2canvas.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js":
                  "vendor/jspdf.umd.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js":
                  "vendor/jszip.min.js",

              "https://cdn.tailwindcss.com":
                  "vendor/tailwind.cdn.js",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Remove only script tags whose content/src contains rrweb.
          s = re.sub(
              r'<script\b[^>]*rrweb[^>]*>\s*</script>',
              '',
              s,
              flags=re.IGNORECASE
          )

          # Remove only a script tag whose body contains an rrweb URL.
          s = re.sub(
              r'<script\b[^>]*>\s*[^<]*rrweb[^<]*</script>',
              '',
              s,
              flags=re.IGNORECASE
          )

          # Remove only the dynamic rrweb script.src assignment.
          s = re.sub(
              r'^[ \t]*script\.src\s*=\s*[^;]*rrweb[^;]*;\s*$',
              '',
              s,
              flags=re.IGNORECASE | re.MULTILINE
          )

          # Also remove the exact rrweb URL if it remains inside a string.
          s = re.sub(
              r'https://cdn\.jsdelivr\.net/npm/rrweb@[^"\')\s<]+',
              '',
              s,
              flags=re.IGNORECASE
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify offline web files
        shell: bash
        run: |
          set -e

          test -f "app/src/main/assets/www/index.html"
          test -f "app/src/main/assets/www/vendor/xlsx.full.min.js"
          test -f "app/src/main/assets/www/vendor/html2canvas.min.js"
          test -f "app/src/main/assets/www/vendor/jspdf.umd.min.js"
          test -f "app/src/main/assets/www/vendor/jszip.min.js"
          test -f "app/src/main/assets/www/vendor/tailwind.cdn.js"
          test -f "app/src/main/assets/www/vendor/vazirmatn/fonts.css"

      - name: Verify HTML integrity
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")

          checks = [
              "<html",
              "</html>",
              "<body",
              "</body>"
          ]

          for item in checks:
              if item.lower() not in s.lower():
                  raise SystemExit(
                      "ERROR: HTML integrity check failed: " + item
                  )

          print("HTML integrity check passed")
          PY

      - name: Verify rrweb removed
        shell: bash
        run: |
          set -e

          if grep -ni "rrweb" app/src/main/assets/www/index.html; then
            echo "ERROR: rrweb reference remains in index.html"
            exit 1
          fi

          echo "rrweb check passed"

      - name: Verify no runtime CDN dependencies
        shell: bash
        run: |
          set -e

          if grep -nE \
            'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.tailwindcss\.com)' \
            app/src/main/assets/www/index.html; then

            echo "External runtime dependency remains in index.html"
            exit 1
          fi

          echo "Offline dependency check passed"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahestanOffline-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14