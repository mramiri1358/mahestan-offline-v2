name: Build Offline APK v2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare offline web dependencies
        shell: bash
        run: |
          set -euo pipefail

          WEB="app/src/main/assets/www"
          VENDOR="$WEB/vendor"

          mkdir -p "$VENDOR"

          test -f "$WEB/index.html"

          curl -L --fail --retry 3 \
            -o "$VENDOR/xlsx.full.min.js" \
            "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/html2canvas.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/jszip.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"

          curl -L --fail --retry 3 \
            -o "$VENDOR/tailwind.cdn.js" \
            "https://cdn.tailwindcss.com"

          mkdir -p "$VENDOR/vazirmatn"

          npm pack vazirmatn@33.003 --silent

          PKG="vazirmatn-33.003.tgz"
          test -f "$PKG"

          tar -xzf "$PKG"

          CSS="$(find package -type f \
            -name 'Vazirmatn-font-face.css' | head -n 1)"

          if [ -z "$CSS" ]; then
            echo "ERROR: Vazirmatn CSS not found"
            exit 1
          fi

          cp "$CSS" "$VENDOR/vazirmatn/Vazirmatn-font-face.css"

          CSSDIR="$(dirname "$CSS")"

          cp "$CSSDIR"/*.woff2 "$VENDOR/vazirmatn/" 2>/dev/null || true
          cp "$CSSDIR"/*.woff "$VENDOR/vazirmatn/" 2>/dev/null || true
          cp "$CSSDIR"/*.ttf "$VENDOR/vazirmatn/" 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          web = Path("app/src/main/assets/www")
          p = web / "index.html"

          s = p.read_text(encoding="utf-8")

          replacements = {
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css":
                  "vendor/vazirmatn/Vazirmatn-font-face.css",

              "https://cdn.tailwindcss.com":
                  "vendor/tailwind.cdn.js",

              "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js":
                  "vendor/xlsx.full.min.js",

              "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js":
                  "vendor/xlsx.full.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js":
                  "vendor/html2canvas.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js":
                  "vendor/jspdf.umd.min.js",

              "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js":
                  "vendor/jszip.min.js",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Remove the optional external rrweb script.
          s = re.sub(
              r'<script\b[^>]*src=["\']https://cdn\.jsdelivr\.net/npm/rrweb@[^"\']+["\'][^>]*>\s*</script>',
              '',
              s,
              flags=re.I
          )

          # The PWA manifest is not required inside the Android APK.
          # Remove only the placeholder link; preserve other HTML content.
          s = re.sub(
              r'<link\b(?=[^>]*\bid=["\']manifest-placeholder["\'])[^>]*>',
              '',
              s,
              count=1,
              flags=re.I
          )

          p.write_text(s, encoding="utf-8")

          # Rewrite font URLs to use the bundled local font files.
          css = web / "vendor/vazirmatn/Vazirmatn-font-face.css"

          if css.exists():
              content = css.read_text(encoding="utf-8")

              content = re.sub(
                  r'url\((["\']?)([^)"\']+)\1\)',
                  lambda m: f'url({m.group(1)}{Path(m.group(2)).name}{m.group(1)})',
                  content
              )

              css.write_text(content, encoding="utf-8")
          PY

          echo "Offline dependencies prepared."

      - name: Verify bundled dependencies
        shell: bash
        run: |
          set -euo pipefail

          WEB="app/src/main/assets/www"
          VENDOR="$WEB/vendor"

          test -s "$WEB/index.html"
          test -s "$VENDOR/xlsx.full.min.js"
          test -s "$VENDOR/html2canvas.min.js"
          test -s "$VENDOR/jspdf.umd.min.js"
          test -s "$VENDOR/jszip.min.js"
          test -s "$VENDOR/tailwind.cdn.js"
          test -s "$VENDOR/vazirmatn/Vazirmatn-font-face.css"

          echo "Required files exist."

      - name: Verify no known external runtime CDN dependencies
        shell: bash
        run: |
          set -euo pipefail

          WEB="app/src/main/assets/www"

          if grep -nE \
            'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.tailwindcss\.com)' \
            "$WEB/index.html"; then

            echo "ERROR: External CDN reference remains in index.html"
            exit 1
          fi

          echo "No known external CDN references remain in index.html."

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahestanOffline-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14